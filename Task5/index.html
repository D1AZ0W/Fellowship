<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/style.css" rel="stylesheet" />
    <title>Task5</title>
  </head>
  <body class="flex flex-col">
    <h1 class="justify-center">Task 5: Personal Expense Tracker</h1>
    <section class="m-10 space-y-10">
      <button
        class="flex p-5 bg-blue-500 hover:bg-blue-700 rounded-2xl cursor-pointer w-full justify-center sm:w-2/4"
        onclick="handleCreate()"
      >
        Add Expenses
      </button>
      <div class="grid grid-cols-1 md:grid-cols-2 mt-10 items-center w-[140px]">
        <span class="overflow-visible mb-3">Filters : </span>
        <div class="space-x-8 flex">
          <select
            id="userFilter"
            class="p-3 bg-slate-500 rounded cursor-pointer"
            onchange="handleFilter()"
          >
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Groceries">Groceries</option>
            <option value="Bills">Bills</option>
          </select>
          <input
            type="date"
            id="calendar"
            class="cursor-pointer p-3 bg-slate-500 rounded"
            onchange="handleFilter()"
          />
        </div>
      </div>
      <div id="expenseList">
        <h2 class="font-bold text-xl">Total Expenses:</h2>
        <div id="expenseTable"></div>
      </div>
      <div id="statistics">
        <h2 class="font-bold text-xl">Details:</h2>
        <div id="details"></div>
      </div>
    </section>
    <footer class="flex justify-center bg-slate-600 mt-auto p-5">
      Made by Ansh Shrestha &copy;
    </footer>
  </body>
</html>
