<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/style.css" rel="stylesheet" />
    <title>Task5</title>
  </head>
  <body class="flex flex-col">
    <h1>Task 5: Personal Expense Tracker</h1>
    <section class="mx-auto w-full p-6 space-y-6">
      <button
        class="flex p-5 bg-blue-500 hover:bg-blue-700 rounded-2xl cursor-pointer w-full justify-center sm:w-1/4"
        id="create"
      >
        Add Expenses
      </button>
      <div class="flex flex-col sm:flex-row space-x-3">
        <div class="flex justifiy-center space-x-5 mb-5 items-center">
          <span class="relative top-2">Filters :</span>
        </div>
        <div class="space-x-8 flex">
          <select id="useFilter" class="p-3 bg-slate-500 rounded cursor-pointer">
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Groceries">Groceries</option>
            <option value="Bills">Bills</option>
          </select>
          <input type="date" id="calendar" class="cursor-pointer p-3 bg-slate-500 rounded" />
        </div>
        <button type="reset" class="bg-red-500 hover:bg-red-800 rounded-4xl px-6 py-3 mt-5 sm:mt-0" id="clear">
          Clear Filter
        </button>
      </div>
      <div id="expenseList">
        <h2 class="font-bold text-xl">Total Expenses:</h2>
        <div id="expenseTable"></div>
      </div>
      <div id="statistics">
        <h2 class="font-bold text-xl">Details:</h2>
        <div id="details"></div>
      </div>
    </section>
    <footer class="flex justify-center bg-slate-600 mt-auto p-5">Made by Ansh Shrestha &copy;</footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
