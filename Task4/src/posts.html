<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Posts</h1>
    <aside class="ml-10 transition-all duration-300 hover:text-red-300">
      <a href="../index.html">Go Back</a>
    </aside>
    <button
      class="flex m-10 p-7 bg-blue-500 hover:bg-blue-700 rounded-2xl"
      onclick="handleCreate()"
    >
      Create Post
    </button>
    <div class="flex gap-5 m-10 flex-wrap">
      <input
        id="searchInput"
        type="text"
        placeholder="Search posts"
        class="p-3 bg-slate-500 rounded"
        oninput="handleSearch(this.value)"
      />

      <select
        id="userFilter"
        class="p-3 bg-slate-500 rounded"
        onchange="handleFilter(this.value)"
      >
        <option value="">All Users</option>
        <option value="1">User 1</option>
        <option value="2">User 2</option>
        <option value="3">User 3</option>
        <option value="4">User 4</option>
        <option value="5">User 5</option>
        <option value="6">User 6</option>
        <option value="7">User 7</option>
        <option value="8">User 8</option>
        <option value="9">User 9</option>
        <option value="10">User 10</option>
      </select>
    </div>
    <div class="ml-5 text-xl p-5 grow" id="postList"></div>
    <div class="flex items-center justify-center mt-5">
      <button
        type="button"
        class="bg-blue-500 px-10 py-5 m-5 disabled:text-gray-400 disabled:cursor-not-allowed active:bg-blue-700"
        onclick="updatePage(false)"
      >
        Prev
      </button>
      <h3 class="text-xl font-bold mx-5" id="pageNumber"></h3>
      <button
        type="button"
        class="bg-blue-500 px-10 py-5 m-5 active:bg-blue-800"
        onclick="updatePage(true)"
      >
        Next
      </button>
    </div>
    <footer class="flex justify-center bg-slate-600 mt-auto p-5">
      Made by Ansh Shrestha &copy;
    </footer>
    <script src="./posts.js"></script>
  </body>
</html>
