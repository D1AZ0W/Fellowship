[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-dotenv>=1.4.2",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
docstring-code-line-length= 20

[tool.uv.workspace]
members = [
    "venv",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]
