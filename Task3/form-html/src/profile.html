<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Profile</title>
    <script src="./main.js"></script>
  </head>
  <body>
    <header>User Profile</header>
    <aside class="ml-10 transition-all duration-300 hover:text-red-300">
      <a href="/">Go Back</a>
    </aside>
    <div class="flex justify-center mt-10">
      <div class="bg-white text-black p-8 rounded-xl w-full max-w-lg">
        <h1 class="text-center mb-6">Profile Information</h1>
        <div class="space-y-3">
          <p><strong>Username:</strong> <span id="username"></span></p>
          <p><strong>Email:</strong> <span id="email"></span></p>
          <p><strong>Address:</strong> <span id="address"></span></p>
          <p><strong>Phone:</strong> <span id="phone"></span></p>
        </div>

        <button
          class="mt-6 w-full bg-red-500 text-white p-3 rounded-lg hover:bg-red-700"
          onclick="handleDelete()"
        >
          Delete Profile
        </button>
        <p id="msg" class="text-center mt-4 text-red-500"></p>
      </div>
    </div>
    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      const msg = document.getElementById("msg");
      if (!user) {
        msg.textContent = "No user found. Please register first.";
        document.getElementById("deleteBtn").style.display = "none";
      } else {
        document.getElementById("username").textContent = user.username;
        document.getElementById("email").textContent = user.email;
        document.getElementById("address").textContent = user.address;
        document.getElementById("phone").textContent = user.phone;
      }
    </script>
  </body>
</html>
